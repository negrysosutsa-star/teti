name: Build BogEmpty

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip sources
        run: |
          mkdir -p bogempty-mod
          unzip bogempty-src.zip -d bogempty-mod
          ls -la bogempty-mod

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Minecraft Sources
        run: |
          cd bogempty-mod
          chmod +x gradlew
          ./gradlew genSources --no-daemon

      - name: Build
        run: |
          cd bogempty-mod
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: BogEmpty-Mod
          path: bogempty-mod/build/libs/*.jar