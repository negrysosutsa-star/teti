name: Build BogEmpty

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем Java. Если мод старый (1.16.5 и ниже) - поменяйте на '8' или '17'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Даем права на выполнение gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Собираем проект
      - name: Build with Gradle
        run: ./gradlew build

      # Сохраняем готовый .jar файл
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BogEmpty-Mod
          path: build/libs/*.jar