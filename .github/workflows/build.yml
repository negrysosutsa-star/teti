name: Build BogEmpty

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10
          cache-disabled: true

      # ЭТА СТРОЧКА ОБХОДИТ ОШИБКУ
      - name: Build with Gradle (ignore mismatch)
        run: gradle build --no-daemon -Porg.gradle.plugin.api-version=8.10

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BogEmpty-Mod
          path: build/libs/*.jar