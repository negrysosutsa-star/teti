name: Build BogEmpty

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip sources
        run: |
          unzip bogempty-src.zip
          ls -la
          ls -la bogempty-mod || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: |
          cd bogempty-mod
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: bogempty-jar
          path: bogempty-mod/build/libs/*.jar
